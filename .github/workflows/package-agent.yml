name: Package Windows Agent

on:
  push:
    branches: [main]
    paths:
      - "agent/windows/**"
      - ".github/workflows/package-agent.yml"
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Validate agent
        run: |
          python3 -m py_compile agent/windows/agent.py
          grep -q 'APP_VERSION = "0.8.0"' agent/windows/agent.py
          grep -q 'AGENT_PREPARE_COMPLETE' agent/windows/agent.py
          grep -q 'AGENT_VIDEO_SOURCE_PROBED' agent/windows/agent.py
          grep -q 'AUTO_UPSCALE_GUARD' agent/windows/agent.py
          grep -q 'YOUTUBE_BACKGROUND_SELECTED' agent/windows/agent.py
          grep -q 'YOUTUBE_BACKGROUND_FALLBACK' agent/windows/agent.py
          grep -q 'youtubeBackgroundNonBlocking' agent/windows/agent.py
          grep -q '^yt-dlp\[default\]' agent/windows/requirements.txt
          grep -q 'bundled_deno' agent/windows/agent.py
          grep -q 'communicate(timeout=min(0.35, remaining))' agent/windows/agent.py
          grep -q 'YOUTUBE_BACKGROUND_QUERY_NORMALIZED' agent/windows/agent.py
          grep -q 'agent:background:prepare' agent/windows/agent.py
          grep -q '"audioAacBitrate": "192k"' agent/windows/agent.py
          grep -q 'YOUTUBE_BACKGROUND_PREPARE_MODE' agent/windows/agent.py
          grep -q 'STREAM_COPY' agent/windows/agent.py
          grep -q 'FAST_TRANSCODE' agent/windows/agent.py
          grep -q 'height<=480' agent/windows/agent.py
          grep -q 'duration not in (30, 45, 60, 120)' agent/windows/agent.py
          grep -q '"-b:a", "192k"' agent/windows/agent.py

      - name: Build ZIP
        run: |
          set -euo pipefail
          ROOT=dist/KITKARAOKE_AGENT_WINDOWS_LAB_V0.8.0
          mkdir -p "$ROOT/engine"
          cp agent/windows/agent.py "$ROOT/"
          cp agent/windows/requirements.txt "$ROOT/"
          cp agent/windows/INICIAR_KITKARAOKE_AGENT.bat "$ROOT/"
          cp agent/windows/README.md "$ROOT/"

          # Runtime JS portable requerido por yt-dlp para YouTube moderno.
          # Se fija versión y SHA256 para que el paquete sea reproducible.
          curl -fL --retry 3             https://github.com/denoland/deno/releases/download/v2.9.6/deno-x86_64-pc-windows-msvc.zip             -o /tmp/deno-windows.zip
          echo "15e5300b0ba3c3695a7621d90160a746ec9e710228cee639afa9d580f6e3cd11  /tmp/deno-windows.zip" | sha256sum -c -
          unzip -j /tmp/deno-windows.zip deno.exe -d "$ROOT/engine"
          test -s "$ROOT/engine/deno.exe"

          cd dist
          zip -r KITKARAOKE_AGENT_WINDOWS_LAB_V0.8.0.zip KITKARAOKE_AGENT_WINDOWS_LAB_V0.8.0

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: KITKARAOKE_AGENT_WINDOWS_LAB_V0.8.0
          path: dist/KITKARAOKE_AGENT_WINDOWS_LAB_V0.8.0.zip
          if-no-files-found: error
          retention-days: 14
