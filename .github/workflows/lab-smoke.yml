name: LAB smoke test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install
        run: npm install

      - name: Syntax check server
        run: npm run check

      - name: Syntax check TV CDG engines
        run: |
          node --check public/cdg-engine-lite.js
          node --check public/sdf-renderer.js
          node --check public/sdf-karaoke-pro-renderer.js
          python3 - <<'PY'
          import re
          from pathlib import Path
          for source, out in [('public/tv.html','/tmp/tv-inline.js'),('public/dj.html','/tmp/dj-inline.js')]:
              html=Path(source).read_text(encoding='utf-8')
              scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',html,re.S|re.I)
              Path(out).write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/tv-inline.js
          node --check /tmp/dj-inline.js

      - name: Syntax check Windows agent
        run: python3 -m py_compile agent/windows/agent.py

      - name: Verify phase 4 contracts
        run: |
          grep -q 'media:prepare' src/server-v3.js
          grep -q 'OVH_UPLOAD_COMPLETE' src/server-v3.js
          grep -q 'diagnostics:get' src/server-v3.js
          grep -q 'Accept-Ranges' src/server-v3.js
          grep -q 'FULL_BEFORE_PLAY' src/server-v3.js
          grep -q 'agent:prepare' agent/windows/agent.py
          grep -q 'AGENT_AUDIO_TRANSCODE_READY' agent/windows/agent.py
          grep -q 'TV_SYNC_SAMPLE' public/tv.html
          grep -q 'SDFHDRenderer' public/tv.html
          grep -q 'SDFKaraokeProRenderer' public/tv.html
          grep -q 'cdgQuality' src/server-v3.js
          grep -q 'SDF LAB V2' public/dj.html
          grep -q 'SDF KARAOKE PRO' public/dj.html
          grep -q 'Copiar logs TV' public/tv.html
          grep -q 'buildTvDiagnosticText' public/tv.html
          grep -q 'TV_BACKGROUND_FALLBACK' public/tv.html
          grep -q 'requestVideoFrameCallback' public/tv.html
          grep -q 'TV_PRELOAD_RETRY' public/tv.html
          grep -q 'TV_PLAY_ABORTED_BY_LOAD' public/tv.html
          grep -q 'TV_VIDEO_FREEZE' public/tv.html
          grep -q 'LAB-TV-4.4' public/tv.html
          grep -q 'SDF_FRAME_MIN_MS = 25' public/tv.html
          grep -q 'TV_LOAD_HANDLER_ERROR' public/tv.html
          grep -q 'TV_JS_ERROR' public/tv.html
          python3 - <<'PY'
          from pathlib import Path
          s=Path('public/tv.html').read_text(encoding='utf-8')
          start=s.index('function resetBackgroundPerformanceMetrics()')
          end=s.index('function resetPlaybackMetrics()', start)
          body=s[start:end]
          assert body.count('resetBackgroundPerformanceMetrics()') == 1, 'recursive background metrics reset detected'
          assert 'backgroundMetrics.frames = 0' in body
          PY
          grep -q 'TV_BUFFERING_IGNORED_STARTUP' public/tv.html
          grep -q 'TV_AUDIO_WAITING.*_CONFIRMED\|name + "_CONFIRMED"' public/tv.html
          grep -q 'displayFps' public/tv.html
          grep -q 'playbackStateForDiagnostic' public/tv.html
          grep -q 'TRANSPORT_MODE = "HTTP_PRELOAD"' public/tv.html
          grep -q 'player:settings' src/server-v3.js
          grep -q 'transport:ping' src/server-v3.js
          grep -q 'cdgBackground' src/server-v3.js
          grep -q 'backgroundQuality' src/server-v3.js
          grep -q 'videoQuality' src/server-v3.js
          grep -q 'data-bg="waves"' public/dj.html
          grep -q 'data-video-quality="720"' public/dj.html
          grep -q 'transparentBackground' public/sdf-renderer.js
          grep -q 'transparentBackground' public/sdf-karaoke-pro-renderer.js
          grep -q 'APP_VERSION = "0.6.1"' agent/windows/agent.py
          grep -q '"videoQualities": \["auto", "360", "540", "720"\]' agent/windows/agent.py
          grep -q '"smartAutoResolution": True' agent/windows/agent.py
          grep -q 'AGENT_VIDEO_SOURCE_PROBED' agent/windows/agent.py
          grep -q 'AGENT_VIDEO_QUALITY_DECISION' agent/windows/agent.py
          grep -q 'AUTO_KEEP_SOURCE_RESOLUTION' agent/windows/agent.py
          grep -q 'AUTO_DOWNSCALE_TO_720P_CAP' agent/windows/agent.py
          grep -q 'AUTO_UPSCALE_GUARD' agent/windows/agent.py
          grep -q "min(1280,iw)" agent/windows/agent.py
          grep -q "min(720,ih)" agent/windows/agent.py
          grep -q 'Descargar TXT' public/dj.html
          grep -q 'data-bg="youtube-auto"' public/dj.html
          grep -q 'youtubeBlur' public/dj.html
          grep -q 'youtubeShade' public/dj.html
          grep -q 'player:background' src/server-v3.js
          grep -q 'YOUTUBE_BACKGROUND_READY' src/server-v3.js
          grep -q 'TV_YOUTUBE_BACKGROUND_READY' public/tv.html
          grep -q 'TV_YOUTUBE_BACKGROUND_FALLBACK' public/tv.html
          grep -q 'YOUTUBE_BACKGROUND_SEARCH_START' agent/windows/agent.py
          grep -q 'YOUTUBE_BACKGROUND_SELECTED' agent/windows/agent.py
          grep -q 'YOUTUBE_BACKGROUND_STREAM_RESOLVED' agent/windows/agent.py
          grep -q 'YOUTUBE_BACKGROUND_TRANSCODE_READY' agent/windows/agent.py
          grep -q 'YOUTUBE_BACKGROUND_FALLBACK' agent/windows/agent.py
          grep -q 'youtubeBackgroundNonBlocking' agent/windows/agent.py
          grep -q '^yt-dlp' agent/windows/requirements.txt
          grep -q 'tv-youtube-bg' public/app.css
          grep -q 'youtubeBgVideo' public/tv.html
          grep -q 'TV_CLIENT_STALE' src/server-v3.js
          grep -q 'api/client-version' src/server-v3.js
          grep -q 'checkClientVersion' public/tv.html
          grep -q 'agent:background:prepare' src/server-v3.js
          grep -q 'agent:background:prepare' agent/windows/agent.py
          grep -q 'YOUTUBE_BACKGROUND_LIVE_REQUEST_SENT' src/server-v3.js
          grep -q 'YOUTUBE_BACKGROUND_QUERY_NORMALIZED' agent/windows/agent.py
          grep -q 'communicate(timeout=min(0.35, remaining))' agent/windows/agent.py
          grep -q 'backgroundState' src/server-v3.js
          python3 - <<'PY'
          from pathlib import Path
          s=Path('src/server-v3.js').read_text(encoding='utf-8')
          start=s.index('function expectedKinds')
          end=s.index('function createMediaJob', start)
          block=s[start:end]
          assert '["cdg", "audio"]' in block, 'YouTube background must not become a required CDG part'
          assert 'optional:' in s and '["background"]' in s, 'optional background contract missing'
          tv=Path('public/tv.html').read_text(encoding='utf-8')
          assert 'loadYoutubeBackground(' in tv
          assert 'karaokeContinues: true' in tv
          PY

      - name: Start server
        run: |
          npm start > server.log 2>&1 &
          echo $! > server.pid
          sleep 3

      - name: Health check phase 4
        run: |
          curl --fail --silent http://127.0.0.1:3000/health | tee /tmp/health.json
          grep -q '"phase":4' /tmp/health.json
          grep -q '"agentsOnline":0' /tmp/health.json
          grep -q '"mediaJobs":0' /tmp/health.json
          echo

      - name: Verify pages
        run: |
          curl --fail --silent http://127.0.0.1:3000/dj | grep -q 'Diagnóstico permanente'
          curl --fail --silent http://127.0.0.1:3000/tv | grep -q 'precarga completa'
          curl --fail --silent http://127.0.0.1:3000/tv | grep -q 'sdf-karaoke-pro-renderer.js'
          curl --fail --silent http://127.0.0.1:3000/dj | grep -q 'SDF KARAOKE PRO'

      - name: Show logs on failure
        if: failure()
        run: cat server.log || true
