name: LAB smoke test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install
        run: npm install

      - name: Syntax check server
        run: npm run check

      - name: Syntax check Windows agent
        run: python3 -m py_compile agent/windows/agent.py

      - name: Verify agent safety contract
        run: |
          grep -q 'agent:register' src/server.js
          grep -q 'agent:search' src/server.js
          grep -q 'NO se envían a OVH' agent/windows/agent.py
          grep -q 'CDG_EXT' agent/windows/agent.py

      - name: Start server
        run: |
          npm start > server.log 2>&1 &
          echo $! > server.pid
          sleep 3

      - name: Health check phase 2
        run: |
          curl --fail --silent http://127.0.0.1:3000/health | tee /tmp/health.json
          grep -q '"phase":2' /tmp/health.json
          grep -q '"agentsOnline":0' /tmp/health.json
          echo

      - name: Show logs on failure
        if: failure()
        run: cat server.log || true
