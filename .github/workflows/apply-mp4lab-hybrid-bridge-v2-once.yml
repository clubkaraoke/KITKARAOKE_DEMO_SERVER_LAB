name: Apply MP4 LAB hybrid bridge V2 once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-mp4lab-hybrid-bridge-v2-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply patch
        run: python3 tools/patch_mp4lab_hybrid_bridge.py
      - name: Validate
        run: |
          node --check src/server-v3.js
          grep -q 'KITKARAOKE_MP4LAB_HYBRID_BRIDGE_V1' src/server-v3.js
          grep -q '/api/hybrid/mp4-background/request' src/server-v3.js
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/server-v3.js
          if git diff --cached --quiet; then
            echo 'Already applied.'
          else
            git commit -m 'feat: bridge MP4 LAB YouTube jobs to Windows Agent'
            git push origin HEAD:main
          fi
