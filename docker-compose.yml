services:
  demo-server:
    build: .
    container_name: kitkaraoke-demo-server-lab
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      SESSION_TTL_MINUTES: 120
      MEDIA_TTL_MINUTES: 20
      MEDIA_DIR: /data/media
      MAX_UPLOAD_MB: 80
    ports:
      - "127.0.0.1:${DEMO_HOST_PORT:-8795}:3000"
    volumes:
      - /var/lib/kitkaraoke-demo-server-lab/media:/data/media
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 10s
